<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting...</title>
</head>
<body>

  <script>
    const token = localStorage.getItem("token");

    if (token) {
      window.location.href = "dashboard.html";
    } else {
      window.location.href = "login.html";
    }
  </script>

</body>
</html>
